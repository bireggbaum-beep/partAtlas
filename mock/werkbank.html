<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock: Baugruppen-Werkbank</title>
<style>
/* MOCK, nicht Teil der Anwendung. Werkbank nach KONZEPT §4.5b (11.10.2026): links Navigator (Projekte, Bausteine, Katalog als Quelle),
   Mitte das Dokument mit den Reitern Aufbau (Baum-Tabelle) · Summiert · Fertigung — die einzige Stelle mit Auswahl, jeder Reiter mit seiner
   eigenen —, rechts die Eigenschaften der Auswahl. Nichts wählt anderswo mit. Alles bedienbar, Daten im Skript unten; Datei im Browser öffnen.
   Vorbilder: Onshape-BOM, OpenBOM, Arena (Struktur und Stückliste als eine Baum-Tabelle), VS Code (Befehlspalette). */
:root {
  --s1: 3px; --s2: 5px; --s3: 8px; --s4: 13px; --s5: 21px; --radius: 4px;
  --bg: oklch(0.965 0.004 60); --panel: oklch(1 0 0); --panel-2: oklch(0.985 0.003 60);
  --line: oklch(0.895 0.006 60); --line-strong: oklch(0.82 0.008 60);
  --ink: oklch(0.245 0.01 45); --ink-2: oklch(0.42 0.01 50); --ink-3: oklch(0.50 0.008 50);
  --accent: oklch(0.565 0.165 30); --accent-ink: oklch(0.99 0.01 30); --accent-soft: oklch(0.945 0.03 30);
  --good: oklch(0.52 0.13 150); --warn: oklch(0.62 0.14 80); --crit: oklch(0.55 0.18 18);
  --sel: oklch(0.94 0.02 40); --shadow: 0 8px 24px oklch(0 0 0 / 0.18);
  --mono: 'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace;
}
:root[data-thema="dunkel"] {
  --bg: oklch(0.165 0.005 60); --panel: oklch(0.205 0.006 60); --panel-2: oklch(0.235 0.006 60);
  --line: oklch(0.295 0.008 60); --line-strong: oklch(0.375 0.01 60);
  --ink: oklch(0.945 0.005 60); --ink-2: oklch(0.80 0.008 60); --ink-3: oklch(0.68 0.01 60);
  --accent: oklch(0.735 0.155 34); --accent-ink: oklch(0.17 0.03 30); --accent-soft: oklch(0.285 0.05 32);
  --good: oklch(0.72 0.14 150); --warn: oklch(0.8 0.15 85); --crit: oklch(0.68 0.19 15);
  --sel: oklch(0.29 0.03 40); --shadow: 0 8px 24px oklch(0 0 0 / 0.5);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 13px/1.35 'Barlow', 'Segoe UI', Helvetica, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }
.dim { color: var(--ink-3); }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Gerüst: Kopfleiste, drei Spalten, Statuszeile ---------- */
.wb { display: grid; height: 100vh; grid-template-rows: 38px 1fr 24px; }
.leiste { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.leiste .titel { font-weight: 600; font-size: 14px; white-space: nowrap; }
.leiste .titel small { font-weight: 400; color: var(--ink-3); margin-left: 6px; }
.trenner { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.luecke { flex: 1; }
.kn { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 3px 8px; cursor: pointer; white-space: nowrap; }
.kn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line); }
.kn:disabled { opacity: 0.4; cursor: default; }
.kn.rand { border-color: var(--line); background: var(--panel-2); }
.kn.akzent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
kbd { font: 11px var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--ink-3); }
.wahl { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 6px; }
.marke { font: 11px var(--mono); padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line-strong); color: var(--ink-2); }
.marke.fork { color: var(--accent); border-color: var(--accent); }

.raum { display: grid; grid-template-columns: var(--bl, 260px) 5px 1fr 5px var(--br, 330px); min-height: 0; }
.spalte { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
.mitte { background: var(--bg); }
.griff { cursor: col-resize; background: var(--line); }
.griff:hover, .griff.zieht { background: var(--accent); }
.kopf { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-bottom: 1px solid var(--line); flex: none; }
.kopf b { font: 600 11px var(--mono); letter-spacing: 0.1em; color: var(--ink-3); }
.stat { display: flex; align-items: center; gap: 16px; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12px; }
.stat b { font-family: var(--mono); font-weight: 500; color: var(--ink); }

/* ---------- Baum ---------- */
.filter { display: flex; gap: 5px; padding: 6px 8px; border-bottom: 1px solid var(--line); flex: none; }
.filter input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 7px; }
.chip { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.chip.an { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.baum { flex: 1; overflow: auto; padding: 4px 0; outline: none; }
.z { display: flex; align-items: center; gap: 5px; height: 24px; padding-right: 8px; cursor: default; white-space: nowrap; border-left: 2px solid transparent; }
.z:hover { background: var(--panel-2); }
.z.sel { background: var(--sel); border-left-color: var(--accent); }
.z.dropp { outline: 1px dashed var(--accent); outline-offset: -1px; background: var(--accent-soft); }
.z .pf { width: 14px; text-align: center; color: var(--ink-3); cursor: pointer; font-size: 10px; flex: none; }
.z .n { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.z .m { font: 12px var(--mono); color: var(--accent); flex: none; }
.z .sub { font: 11px var(--mono); color: var(--ink-3); flex: none; }
.z .punkt { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.ic-proj { color: var(--accent); }
.ic-baugr { color: oklch(0.55 0.1 250); } .ic-druck { color: oklch(0.58 0.12 60); } .ic-kauf { color: var(--ink-3); }
:root[data-thema="dunkel"] .ic-baugr { color: oklch(0.75 0.1 250); } :root[data-thema="dunkel"] .ic-druck { color: oklch(0.8 0.12 75); }

/* ---------- Katalog-Schublade ---------- */
.schublade { border-top: 1px solid var(--line-strong); display: flex; flex-direction: column; height: 200px; flex: none; }
.schublade.zu { height: 30px; }
.schublade .kopf { cursor: pointer; }
.kat { flex: 1; overflow: auto; }
.k { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; cursor: grab; }
.k:hover { background: var(--panel-2); }
.k .hin { margin-left: auto; opacity: 0; }
.k:hover .hin { opacity: 1; }

/* ---------- Reiter und Arbeitsfläche ---------- */
.reiter { display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; height: 30px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
.reiter button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--ink-2); }
.reiter button.an { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.reiter button .zahl { font: 11px var(--mono); color: var(--ink-3); margin-left: 5px; }
.flaeche { flex: 1; overflow: auto; padding: 12px; min-height: 0; }
.tab { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; }
.tab th { text-align: left; font: 600 11px var(--mono); letter-spacing: 0.08em; color: var(--ink-3); padding: 5px 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
.tab td { padding: 4px 8px; border-bottom: 1px solid var(--line); height: 26px; }
.tab tr.zl:hover { background: var(--panel-2); cursor: default; }
.tab tr.sel { background: var(--sel); }
.tab .re { text-align: right; font-family: var(--mono); }
.tab .gr td { background: var(--panel-2); font-weight: 600; font-size: 12px; color: var(--ink-2); }
h3.ab { font: 600 11px var(--mono); letter-spacing: 0.1em; color: var(--ink-3); margin: 14px 0 6px; }
h3.ab:first-child { margin-top: 0; }
.leer { color: var(--ink-3); padding: 21px; text-align: center; }

/* 3D-Reiter */
.dreid { height: 100%; min-height: 260px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); position: relative; }
.dreid .hinweis { position: absolute; bottom: 10px; left: 12px; right: 12px; color: var(--ink-3); font-size: 12px; text-align: center; }

/* Fertigung: eine gruppierte Tabelle, kein Raster aus Karten */
.ft tbody.ftg.dropp td { background: var(--accent-soft); }
.ft tr.pos { cursor: grab; }
.ft tr.pos:hover td { background: var(--panel-2); }
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 10px; border-bottom: 1px solid var(--line); }
.kv span { color: var(--ink-2); }
.kv b { font: 500 12.5px var(--mono); }
.stepper2 { display: inline-flex; align-items: center; gap: 3px; }
.stepper2 button, .ft .pos .kn { width: 20px; height: 20px; padding: 0; justify-content: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; line-height: 1; }
.stepper2 span { min-width: 26px; text-align: center; }
.fort { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 10px; }
.fort i { display: block; height: 100%; background: var(--good); }

/* ---------- Inspektor ---------- */
.insp { flex: 1; overflow: auto; padding: 0 0 13px; }
.insp .titel { padding: 10px; border-bottom: 1px solid var(--line); }
.insp .titel b { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.insp .titel .dim { margin-top: 2px; }
.gruppe { padding: 8px 10px 2px; font: 600 11px var(--mono); letter-spacing: 0.1em; color: var(--ink-3); }
.feld { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; padding: 3px 10px; }
.feld label { color: var(--ink-2); }
.feld input, .feld select, .feld textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 6px; min-width: 0; }
.feld input:focus, .feld select:focus, .feld textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.feld .einh { position: relative; } .feld .einh input { padding-right: 24px; text-align: right; font-family: var(--mono); }
.feld .einh span { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 11px; pointer-events: none; }
.feld .stepper { display: flex; gap: 3px; } .feld .stepper input { text-align: center; font-family: var(--mono); }
.feld .stepper button { width: 26px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.verw { padding: 2px 10px; }
.verw a { display: flex; gap: 6px; align-items: center; padding: 3px 4px; border-radius: var(--radius); cursor: pointer; color: var(--ink); text-decoration: none; }
.verw a:hover { background: var(--panel-2); }
.verw .m { margin-left: auto; font: 12px var(--mono); color: var(--accent); }
.warn { margin: 6px 10px; padding: 6px 8px; border: 1px solid var(--warn); border-radius: var(--radius); color: var(--ink); background: color-mix(in oklch, var(--warn) 12%, transparent); font-size: 12px; }

/* ---------- Menü, Palette, Dialog, Meldung ---------- */
.ctx { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: var(--shadow); padding: 4px; min-width: 230px; }
.ctx button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 5px 8px; cursor: pointer; border-radius: 4px; }
.ctx button:hover:not(:disabled) { background: var(--accent-soft); }
.ctx button:disabled { opacity: 0.4; cursor: default; }
.ctx button kbd { margin-left: auto; }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.schleier { position: fixed; inset: 0; background: oklch(0 0 0 / 0.35); z-index: 60; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
.dlg { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); width: min(560px, 92vw); max-height: 70vh; display: flex; flex-direction: column; }
.dlg h2 { margin: 0; font-size: 14px; padding: 12px 14px 4px; }
.dlg p { margin: 0; padding: 0 14px 8px; color: var(--ink-2); }
.dlg .liste { overflow: auto; border-top: 1px solid var(--line); }
.dlg .liste .p { display: flex; gap: 8px; align-items: center; padding: 6px 14px; cursor: pointer; }
.dlg .liste .p.akt, .dlg .liste .p:hover { background: var(--accent-soft); }
.dlg .liste .p kbd { margin-left: auto; }
.dlg input.suche { margin: 8px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; }
.dlg .fuss { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.banner { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: color-mix(in oklch, var(--accent) 12%, var(--panel)); border-bottom: 1px solid var(--accent); }
.banner b { font-weight: 600; }
.toast { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 14px; border-radius: 6px; z-index: 80; font-size: 12.5px; box-shadow: var(--shadow); }
.legende { color: var(--ink-3); font-size: 12px; padding: 6px 0 0; }

/* ---------- Navigator links (KONZEPT §4.5b): öffnen und Quelle, keine Auswahl im Dokument ---------- */
.nav .nliste { flex: none; max-height: 170px; overflow: auto; padding: 2px 0; }
.nav .e { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; cursor: pointer; white-space: nowrap; }
.nav .e:hover { background: var(--panel-2); }
.nav .e.offen { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); font-weight: 600; }
.nav .e .n, .kat .k .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .e .m { font: 11px var(--mono); }
.kreiter { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); flex: none; }
.kreiter button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 5px 7px; cursor: pointer; color: var(--ink-2); }
.kreiter button.an { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.k.mark { background: var(--sel); }
/* ---------- Aufbau: Baum-Tabelle ---------- */
.werkz { background: var(--panel); }
.reiter button:disabled { opacity: 0.4; cursor: default; }
.flaeche:focus { outline: none; }
.tt td.n { padding-left: calc(4px + var(--t, 0) * 16px); white-space: nowrap; }
.tt td.n > * { vertical-align: middle; }
.tt .pf { display: inline-block; width: 14px; text-align: center; color: var(--ink-3); cursor: pointer; font-size: 10px; }
.tt .nn { margin-left: 4px; }
.tt tr.zl.sel td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.tt td.mehr { width: 28px; padding: 0 2px; }
.tt td.mehr .kn { opacity: 0; padding: 0 6px; }
.tt tr:hover td.mehr .kn, .tt tr.sel td.mehr .kn { opacity: 1; }
.tt tr.dropp td { background: var(--accent-soft); }
.pl.offen { color: var(--warn); } .pl.ok { color: var(--good); }
.ablage { margin-top: 6px; padding: 5px; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--ink-3); text-align: center; font-size: 12px; }
.ablage.dropp { border-color: var(--accent); background: var(--accent-soft); }
.ft tr.gr[data-fp] { cursor: pointer; }
.ft tr.gr.sel td { background: var(--sel); }
.verw .marke { margin-left: auto; }
</style>
</head>
<body>
<div class="wb" id="wb"></div>

<script>
"use strict";
/* ============================================================== Daten (Graph: Knoten und Kanten) */
const DATEN = () => ({
  teile: {
    // typ: projekt (Bau-Auftrag) | baugr (wiederverwendbarer Baustein) | druck (Druckteil, ein Modell aus dem Katalog) | kauf (Kaufteil)

    m3x12:     { typ: "kauf", name: "Zylinderkopfschraube M3×12", kat: "Schrauben", norm: "ISO 4762", einheit: "Stück", link: "https://aliexpress.com/item/1005002", artnr: "M3x12-A2", hinweis: "" },
    m3x8:      { typ: "kauf", name: "Zylinderkopfschraube M3×8", kat: "Schrauben", norm: "ISO 4762", einheit: "Stück", link: "", artnr: "", hinweis: "" },
    einsatz:   { typ: "kauf", name: "Gewindeeinsatz M3 (Wärmeeinsatz)", kat: "Gewindeeinsätze", norm: "", einheit: "Stück", link: "https://www.amazon.de/dp/B0EXAMPLE", artnr: "B0EXAMPLE", hinweis: "Mit 220 °C Lötkolben setzen" },
    lager623:  { typ: "kauf", name: "Kugellager 623-2RS", kat: "Lager", norm: "", einheit: "Stück", link: "", artnr: "623-2RS", hinweis: "" },
    fan4010:   { typ: "kauf", name: "Lüfter 4010 24 V", kat: "Elektronik", norm: "", einheit: "Stück", link: "https://aliexpress.com/item/1005003", artnr: "", hinweis: "Lüfter-Pfeil zeigt zur Düse" },
    ledstrip:  { typ: "kauf", name: "LED-Strip WS2812B 1 m", kat: "Elektronik", norm: "", einheit: "Stück", link: "https://aliexpress.com/item/1005004", artnr: "", hinweis: "5 V, vor dem Einbau testen" },
  },
  kinder: {   // Projekt oder Baugruppe -> Positionen (Kanten). Menge und Druckparameter hängen an der Kante.
    toolhead: [
      { id: "e1", ziel: "extruder", menge: 1 }, { id: "e2", ziel: "luefter", menge: 2 },
      { id: "e3", ziel: "kette", menge: 1, material: "PETG", infill: 20, waende: 3, schicht: 0.2 },
      { id: "e4", ziel: "duese", menge: 1, material: "PETG", infill: 40, waende: 4, schicht: 0.2 },
      { id: "e5", ziel: "m3x10", menge: 4 },
    ],
    extruder: [
      { id: "e6", ziel: "gehaeuse", menge: 1, material: "PETG", infill: 40, waende: 4, schicht: 0.2 },

/* Gang durch den Graphen: jede Position mit ihrem Pfad und dem Faktor aus den Mengen der Ebenen darüber. */
function gang(asm = wurzel, faktor = 1, pfad = [], besucht = []) {
  const aus = [];
  if (besucht.includes(asm)) return aus;
  for (const e of D.kinder[asm] || []) {
    const p = [...pfad, e.id], f = faktor * e.menge;
    aus.push({ e, pfad: p, faktor: f, eltern: asm });
    if (D.teile[e.ziel].typ === "baugr") aus.push(...gang(e.ziel, f, p, [...besucht, asm]));
  }
  return aus;
}

function summen() {

/* Verteilt heisst: Summe der Mengen auf allen Platten des Projekts ≥ Bedarf aus der Projekt-Stückliste (über Baugruppen hinweg). */
function plan() {
  const bedarf = bedarfVon(wurzel), verteilt = {};
  if (istProjekt()) for (const p of meinePlatten()) for (const x of p.posten) verteilt[x.ziel] = (verteilt[x.ziel] || 0) + x.menge;
  let ges = 0, ver = 0;
  for (const z in bedarf) { ges += bedarf[z]; ver += Math.min(bedarf[z], verteilt[z] || 0); }
  return { bedarf, verteilt, ges, ver };
}

const offen = (z) => Math.max(0, ((PLAN ||= plan()).bedarf[z] || 0) - (PLAN.verteilt[z] || 0));

function bereinigePlatten() {      // Teile, die nicht mehr gebraucht werden, verlassen die Platten
  for (const pl of D.platten) {
    if (!D.kinder[pl.projekt]) continue;
    const bed = bedarfVon(pl.projekt);
    pl.posten.forEach((x) => { x.menge = Math.min(x.menge, bed[x.ziel] || 0); });
    pl.posten = pl.posten.filter((x) => x.menge > 0);
  }
}
function verteile(ziel, von, nach) {
  if (von === nach) return;
  const pl = verteilung(), name = D.teile[ziel].name;
  aendern(`${name} → ${nach ? D.platten.find((p) => p.id === nach).name : "nicht verteilt"}`, () => {
    let menge;
    if (von) { const pv = D.platten.find((p) => p.id === von), i = pv.posten.findIndex((x) => x.ziel === ziel); menge = pv.posten[i].menge; pv.posten.splice(i, 1); }
    else menge = Math.max(0, (pl.bedarf[ziel] || 0) - (pl.verteilt[ziel] || 0));
    if (nach && menge) { const pn = D.platten.find((p) => p.id === nach), ex = pn.posten.find((x) => x.ziel === ziel); if (ex) ex.menge += menge; else pn.posten.push({ ziel, menge }); }
  });
}
function postenMenge(platte, ziel, delta) {
  verteilung();
  const pp = D.platten.find((p) => p.id === platte), x = pp.posten.find((q) => q.ziel === ziel);
  const neu = Math.max(1, Math.min(x.menge + delta, x.menge + offen(ziel)));
  if (neu === x.menge) return meldung(delta > 0 ? "Mehr braucht das Projekt nicht." : "Weniger als 1: mit × zurückgeben.");
  aendern(`${D.teile[ziel].name}: ${neu}× auf ${pp.name}`, () => { x.menge = neu; });
}

    h += `<div class="gruppe">DRUCKVORGABE</div>`;
    h += feld("Material", `<select id="f-material">${["PLA", "PETG", "ABS", "ASA", "TPU", "PC", "PA-CF"].map((x) => `<option ${x === (k.e.material || "PETG") ? "selected" : ""}>${x}</option>`).join("")}</select>`);
    h += feld("Füllung", `<div class="einh"><input id="f-infill" value="${k.e.infill ?? 20}"><span>%</span></div>`);
    h += feld("Wandlinien", `<div class="einh"><input id="f-waende" value="${k.e.waende ?? 3}"><span>×</span></div>`);
    h += feld("Schichthöhe", `<div class="einh"><input id="f-schicht" value="${k.e.schicht ?? 0.2}"><span>mm</span></div>`);
    h += feld("Notiz", `<textarea id="f-pnotiz" rows="2" placeholder="z. B. Stützen nur auf Druckbett">${esc(k.e.notiz || "")}</textarea>`);
    h += `<div class="gruppe">MODELL</div>${kv("Gewicht je Stück", zahl(t.g, 1) + " g")}${kv("Zeit je Stück", dauer(t.min))}${kv("Masse", t.abm.join(" × ") + " mm")}`;
  }
  if (t.typ === "baugr") { const s = summen2(k.e.ziel); h += `<div class="gruppe">INHALT JE STÜCK</div>${kv("Gewicht", zahl(s.g, 0) + " g")}${kv("Druckzeit", dauer(s.min))}${kv("Druckteile", s.teile)}${kv("Zukaufteile", s.kauf)}<div class="feld"><label></label><button class="kn rand" data-oeffne="${k.e.ziel}">Als Baustein öffnen</button></div>`; }
  if (t.typ === "kauf") h += inspBezug(k.e.ziel);
  return h + inspWo(k.e.ziel) + "</div>";
}
function inspBezug(ziel) {
  const t = D.teile[ziel];
  return `<div class="gruppe">BEZUG</div>${feld("Bezugsquelle", `<input id="k-link" value="${esc(t.link)}" placeholder="https://…">`)}${feld("Artikelnr.", `<input id="k-art" value="${esc(t.artnr)}">`)}${feld("Hinweis", `<textarea id="k-hin" rows="2" placeholder="z. B. mit Loctite sichern">${esc(t.hinweis)}</textarea>`)}${kv("Norm", esc(t.norm || "–"))}`;
}
function inspWo(ziel) {
  const ww = wege(ziel);
  return `<div class="gruppe">WO VERBAUT · IM GANZEN KATALOG</div><div class="verw">${ww.map((w) => `<a data-sp="${w.weg[w.weg.length - 1].kante}" data-top="${w.weg[0].id}">${ICON[D.teile[w.weg[0].id].typ]}<span>${w.weg.map((x) => esc(D.teile[x.id].name)).join(" › ")}</span><span class="m">${w.gesamt}×</span></a>`).join("") || '<span class="dim">Nirgends.</span>'}</div>`;
}
function inspSummiert() {
  if (!selS || !D.teile[selS]) return inspWurzel();
  const t = D.teile[selS], vork = gang().filter((x) => x.e.ziel === selS), menge = vork.reduce((a, x) => a + x.faktor, 0);
  let h = kopfInsp(t, t.typ === "druck" ? "Druckteil · " + t.fmt : "Zukaufteil · " + esc(t.kat));
  h += `<div class="gruppe">BEDARF IM DOKUMENT</div>${kv("Menge gesamt", menge + "×")}`;
  if (t.typ === "druck") { h += `${kv("Gewicht", zahl(t.g * menge, 1) + " g")}${kv("Druckzeit", dauer(t.min * menge))}`; if (istProjekt()) h += kv("Auf Platten", `${menge - offen(selS)} / ${menge}`); }
  if (t.typ === "kauf") h += inspBezug(selS);
  h += `<div class="gruppe">VORKOMMEN · ${vork.length}</div><div class="verw">${vork.map((x) => `<a data-auf="${pfadKey(x.pfad)}" title="Im Aufbau zeigen">${ICON[D.teile[x.eltern].typ]}<span>${esc(D.teile[x.eltern].name)}</span><span class="m">${x.e.menge}× → ${x.faktor}×</span></a>`).join("")}</div>`;
  return h + "</div>";
}
function inspFertigung() {
  if (!selF) return inspWurzel();
  const pl = selF.platte && D.platten.find((p) => p.id === selF.platte);
  if (!selF.ziel && pl) {
    const min = pl.posten.reduce((a, x) => a + D.teile[x.ziel].min * x.menge, 0), g = pl.posten.reduce((a, x) => a + D.teile[x.ziel].g * x.menge, 0);
    let h = `<div class="kopf"><b>EIGENSCHAFTEN</b></div><div class="insp"><div class="titel"><b>▭ ${esc(pl.name)}</b><div class="dim">Druckplatte · ${esc(D.teile[wurzel].name)}</div></div>`;
    h += `<div class="gruppe">PLATTE</div>${feld("Name", `<input id="p-name" value="${esc(pl.name)}">`)}${feld("Material", `<select id="p-mat">${["PLA", "PETG", "ABS", "ASA", "TPU", "PC", "PA-CF"].map((x) => `<option ${x === pl.material ? "selected" : ""}>${x}</option>`).join("")}</select>`)}`;
    h += `<div class="gruppe">INHALT</div>${kv("Teile", pl.posten.reduce((a, x) => a + x.menge, 0) + " Stück")}${kv("Druckzeit", dauer(min))}${kv("Gewicht", zahl(g, 0) + " g")}`;
    const abw = pl.posten.filter((x) => gang().some((y) => y.e.ziel === x.ziel && y.e.material && y.e.material !== pl.material));
    if (abw.length) h += `<div class="warn">Vorgabe weicht ab: ${abw.map((x) => esc(D.teile[x.ziel].name)).join(", ")} ${abw.length === 1 ? "ist" : "sind"} nicht für ${esc(pl.material)} vorgesehen.</div>`;
    h += `<div class="gruppe">SPÄTER</div><div class="dim" style="padding:0 10px">Slicer-Datei (3MF/G-Code) anhängen, Drucke dieser Platte.</div>`;
    h += `<div class="feld"><label></label><button class="kn rand" id="p-del" style="color:var(--crit)">Platte löschen</button></div>`;
    return h + "</div>";
  }
  const t = D.teile[selF.ziel]; if (!t) return inspWurzel();
  const x = pl && pl.posten.find((q) => q.ziel === selF.ziel), vorgabe = [...new Set(gang().filter((y) => y.e.ziel === selF.ziel).map((y) => y.e.material).filter(Boolean))];
  let h = kopfInsp(t, pl ? `auf ${esc(pl.name)}` : "noch nicht verteilt");
  h += `<div class="gruppe">VERTEILUNG</div>${kv("Bedarf im Projekt", PLAN.bedarf[selF.ziel] + "×")}${kv("Noch offen", offen(selF.ziel) + "×")}${kv("Vorgabe Material", esc(vorgabe.join(" · ") || "–"))}`;
  if (x) {
    h += feld("Auf dieser Platte", `<div class="stepper"><button data-pm="-1" data-pl="${pl.id}" data-pz="${x.ziel}">−</button><input value="${x.menge}" readonly><button data-pm="1" data-pl="${pl.id}" data-pz="${x.ziel}">＋</button></div>`);
    if (vorgabe.length && !vorgabe.includes(pl.material)) h += `<div class="warn">Vorgabe ${esc(vorgabe.join(" · "))}, die Platte ist ${esc(pl.material)}.</div>`;
    h += `<div class="feld"><label></label><button class="kn rand" data-px="${pl.id}" data-pz="${x.ziel}">Zurück nach „Nicht verteilt“</button></div>`;
  }
  const andere = meinePlatten().filter((p) => p.id !== selF.platte);
  if (offen(selF.ziel) || x) h += `<div class="gruppe">${x ? "VERSCHIEBEN AUF" : "AUF PLATTE LEGEN"}</div><div class="verw">${andere.map((p) => `<a data-nach="${p.id}">▭ <span>${esc(p.name)}</span><span class="marke">${esc(p.material)}</span></a>`).join("") || '<span class="dim">Erst eine Druckplatte anlegen.</span>'}</div>`;
  return h + "</div>";
}
function zeichneInsp() { $("#rechts").innerHTML = reiter === "fertigung" ? inspFertigung() : reiter === "summiert" ? inspSummiert() : inspAufbau(); }

/* Wo verbaut über alle Ebenen: je Verwendung der Weg von oben bis zum Teil, mit Menge je Ebene und Gesamtmenge. */
function wege(ziel) {
  const aus = [];
  const hoch = (id, weg, faktor, gesehen) => {
    for (const a in D.kinder) for (const e of D.kinder[a]) {
      if (e.ziel !== id || gesehen.includes(a)) continue;
      const neu = [{ id: a, menge: e.menge, kante: e.id }, ...weg];
      const hatEltern = Object.values(D.kinder).some((l) => l.some((x) => x.ziel === a));
      if (hatEltern) hoch(a, neu, faktor * e.menge, [...gesehen, a]); else aus.push({ weg: neu, gesamt: faktor * e.menge });
    }
  };
  hoch(ziel, [], 1, [ziel]);
  return aus.sort((x, y) => D.teile[x.weg[0].id].name.localeCompare(D.teile[y.weg[0].id].name));
}
function summen2(asm) {
  let g = 0, min = 0, teile = 0, kauf = 0;
  for (const { e, faktor } of gang(asm)) { const t = D.teile[e.ziel]; if (t.typ === "druck") { g += t.g * faktor; min += t.min * faktor; teile += faktor; } else if (t.typ === "kauf") kauf += faktor; }
  return { g, min, teile, kauf };
}
function zeichneStatus() {
  const s = summen(), v = verteilung();
  const auswahl = reiter === "aufbau" ? (sel.length ? sel.map((id) => D.teile[kante(id).e.ziel].name).join(" › ") : "")
    : reiter === "summiert" ? (selS ? D.teile[selS].name : "") : selF ? [selF.platte ? D.platten.find((p) => p.id === selF.platte)?.name : "Nicht verteilt", selF.ziel ? D.teile[selF.ziel].name : ""].filter(Boolean).join(" › ") : "";
  $("#stat").innerHTML = `<span>Druckteile <b>${s.teile}</b></span><span>Zukaufteile <b>${s.kauf.reduce((a, k) => a + k.menge, 0)}</b></span><span>Gewicht <b>${zahl(s.g, 0)} g</b></span><span>Druckzeit <b>${dauer(s.min)}</b></span>${istProjekt() ? `<span>Platten <b>${v.ver}/${v.ges}</b> verteilt</span>` : ""}<span class="luecke" style="flex:1"></span><span>Auswahl: <b>${esc(auswahl || "–")}</b></span>`;
}

/* ============================================================== Eingaben */
function waehleAufbau(p) { sel = p; zeichneMitte(); zeichneInsp(); zeichneStatus(); }
document.addEventListener("click", (e) => {
  schliesseMenue();
  const t = e.target;
  const r = t.closest("[data-r]"); if (r && !r.disabled) { reiter = r.dataset.r; zeichneMitte(); zeichneInsp(); zeichneStatus(); return; }
  const o = t.closest("[data-oeffne]"); if (o) return oeffne(o.dataset.oeffne);
  if (t.closest("#pneu")) return projektNeu();
  const kr = t.closest("[data-kr]"); if (kr) { kat.reiter = kr.dataset.kr; kat.markiert = null; return zeichneNav(); }
  const kk = t.closest(".k[data-k]"); if (kk) { document.querySelectorAll(".k.mark").forEach((x) => x.classList.remove("mark")); kk.classList.add("mark"); kat.markiert = kk.dataset.k; return; }
  const me = t.closest("[data-mehr]"); if (me) { const z = me.closest("tr"); sel = z.dataset.p.split("/"); zeichneMitte(); zeichneInsp(); zeichneStatus(); const b = me.getBoundingClientRect(); return baumMenue(b.left, b.bottom + 2, me.dataset.mehr); }
  const tg = t.closest(".pf[data-t]"); if (tg) { const k = tg.dataset.t; ausgeklappt.has(k) ? ausgeklappt.delete(k) : ausgeklappt.add(k); return zeichneMitte(); }
  const sp = t.closest("[data-sp]"); if (sp) return springe(sp.dataset.sp, sp.dataset.top);
  const au = t.closest("[data-auf]"); if (au) { const p = au.dataset.auf.split("/"); reiter = "aufbau"; for (let i = 1; i < p.length; i++) ausgeklappt.add(pfadKey(p.slice(0, i))); sel = p; return alles(); }
  if (t.closest("#pn")) return platteNeu();
  if (t.closest("#p-del")) { const pl = selF.platte; aendern("Druckplatte löschen", () => { D.platten = D.platten.filter((p) => p.id !== pl); }); selF = null; return alles(); }
  const pm = t.closest("[data-pm]"); if (pm) return postenMenge(pm.dataset.pl, pm.dataset.pz, Number(pm.dataset.pm));
  const px = t.closest("[data-px]"); if (px) { verteile(px.dataset.pz, px.dataset.px, ""); selF = { platte: "", ziel: px.dataset.pz }; return alles(); }
  const na = t.closest("[data-nach]"); if (na) { verteile(selF.ziel, selF.platte || "", na.dataset.nach); selF = { platte: na.dataset.nach, ziel: selF.ziel }; return alles(); }
  const m = t.closest("[data-m]"); if (m && gewaehlt()) { setzeFeld(sel[sel.length - 1], "menge", gewaehlt().e.menge + Number(m.dataset.m)); return; }
  // Auswahl: nur in der Mitte, jeder Reiter für sich
  const za = t.closest("#tt tr.zl[data-p]"); if (za) return waehleAufbau(za.dataset.p.split("/"));
  const zs = t.closest("tr.zl[data-s]"); if (zs) { selS = zs.dataset.s; zeichneMitte(); zeichneInsp(); zeichneStatus(); return; }
  const fp = t.closest("tr[data-fp]"); if (fp) { selF = { platte: fp.dataset.fp, ziel: null }; zeichneMitte(); zeichneInsp(); zeichneStatus(); return; }
  const fz = t.closest("tr[data-fz]"); if (fz) { selF = { platte: fz.dataset.von, ziel: fz.dataset.fz }; zeichneMitte(); zeichneInsp(); zeichneStatus(); return; }
  // Klick ins Leere der Fläche hebt die Auswahl dieses Reiters auf
  if (t.closest("#flaeche") && !t.closest("tr, button, input")) { if (reiter === "aufbau") sel = []; else if (reiter === "summiert") selS = null; else selF = null; zeichneMitte(); zeichneInsp(); zeichneStatus(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "kq") { kat.q = e.target.value; kat.markiert = null; zeichneNav(); } });
document.addEventListener("dblclick", (e) => { const k = e.target.closest(".k[data-k]"); if (k) hinzufuegen(einfuegeZiel(), k.dataset.k); });
document.addEventListener("contextmenu", (e) => {
  const z = e.target.closest("#tt tr[data-e]"); if (!z) return; e.preventDefault();
  sel = z.dataset.p.split("/"); zeichneMitte(); zeichneInsp(); zeichneStatus(); baumMenue(e.clientX, e.clientY, z.dataset.e);
});
document.addEventListener("change", (e) => {
  const i = e.target, k = gewaehlt(); if (!i.id) return;
  const zahlWert = (v, min, max) => Math.max(min, Math.min(max, parseFloat(String(v).replace(",", ".")) || min));
  const ziel = reiter === "summiert" && selS ? selS : k ? k.e.ziel : wurzel;
  if (i.id === "f-name") aendern("Name", () => { D.teile[wurzel].name = i.value.trim() || D.teile[wurzel].name; });
  else if (i.id === "f-status") aendern("Status", () => { D.teile[wurzel].status = i.value; });
  else if (i.id === "f-notiz") aendern("Notizen", () => { D.teile[wurzel].notiz = i.value; });
  else if (k && i.id === "f-menge") setzeFeld(k.e.id, "menge", zahlWert(i.value, 1, 10000));
  else if (k && i.id === "f-material") setzeFeld(k.e.id, "material", i.value);
  else if (k && i.id === "f-infill") setzeFeld(k.e.id, "infill", zahlWert(i.value, 0, 100));
  else if (k && i.id === "f-waende") setzeFeld(k.e.id, "waende", Math.round(zahlWert(i.value, 1, 20)));
  else if (k && i.id === "f-schicht") setzeFeld(k.e.id, "schicht", zahlWert(i.value, 0.04, 1));
  else if (k && i.id === "f-pnotiz") setzeFeld(k.e.id, "notiz", i.value);
  else if (i.id === "k-link") aendern("Bezugsquelle", () => { D.teile[ziel].link = i.value.trim(); });
  else if (i.id === "k-art") aendern("Artikelnummer", () => { D.teile[ziel].artnr = i.value.trim(); });
  else if (i.id === "k-hin") aendern("Hinweis", () => { D.teile[ziel].hinweis = i.value; });
  else if (i.id === "p-name" || i.id === "p-mat") { const pl = D.platten.find((p) => p.id === selF.platte); aendern("Platte ändern", () => { if (i.id === "p-name") pl.name = i.value.trim() || pl.name; else pl.material = i.value; }); }
});
document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey, tippt = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); return palette(); }
  if (mod && e.key.toLowerCase() === "i") { e.preventDefault(); return katalogFokus(); }
  if (mod && e.key.toLowerCase() === "z" && !tippt) { e.preventDefault(); return e.shiftKey ? vor() : zurueck(); }
  if (mod && e.key.toLowerCase() === "y" && !tippt) { e.preventDefault(); return vor(); }
  if (e.target.id === "kq") {
    const ks = [...document.querySelectorAll(".k[data-k]")].map((x) => x.dataset.k);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const i = ks.indexOf(kat.markiert); kat.markiert = ks[Math.max(0, Math.min(ks.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))] || null; zeichneNav(); }
    if (e.key === "Enter") { const id = kat.markiert || ks[0]; if (id) hinzufuegen(einfuegeZiel(), id); }
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (tippt || document.querySelector(".schleier")) return;
  if (e.key === "Escape") { if (reiter === "aufbau") sel = []; else if (reiter === "summiert") selS = null; else selF = null; return alles(); }
  if (reiter !== "aufbau") return;
  const k = gewaehlt();
  if ((e.key === "Delete" || e.key === "Backspace") && k) return entfernen(k.e.id);
  if (["ArrowDown", "ArrowUp", "ArrowRight", "ArrowLeft"].includes(e.key)) {
    const zeilen = [...document.querySelectorAll("#tt tr.zl")]; const i = zeilen.findIndex((z) => z.classList.contains("sel"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { const n = zeilen[i < 0 ? 0 : i + (e.key === "ArrowDown" ? 1 : -1)]; if (n) waehleAufbau(n.dataset.p.split("/")); }
    if (e.key === "ArrowRight" && k && D.teile[k.e.ziel].typ === "baugr") { ausgeklappt.add(pfadKey(sel)); zeichneMitte(); }
    if (e.key === "ArrowLeft" && k) { if (ausgeklappt.has(pfadKey(sel))) { ausgeklappt.delete(pfadKey(sel)); zeichneMitte(); } else waehleAufbau(sel.slice(0, -1)); }
    e.preventDefault();
  }
});

/* Ziehen: Katalog -> Aufbau (in die Baugruppe oder oberste Ebene), Aufbau -> Baugruppe (verschieben), Fertigung: Teil <-> Platte */
let zug = null;
const baugZiel = (z) => { const ke = z && z.dataset.e && kante(z.dataset.e); return !ke ? wurzel : D.teile[ke.e.ziel].typ === "baugr" ? ke.e.ziel : ke.asm; };
document.addEventListener("dragstart", (e) => {
  const k = e.target.closest?.(".k[data-k]"), z = e.target.closest?.("#tt tr[data-e]"), p = e.target.closest?.("tr.pos[data-fz]");
  zug = k ? { art: "katalog", id: k.dataset.k } : z ? { art: "baum", id: z.dataset.e } : p ? { art: "pos", ziel: p.dataset.fz, von: p.dataset.von } : null;
  if (zug) e.dataTransfer.setData("text/plain", "x");
});
const dropZiel = (e) => zug && (zug.art === "pos" ? e.target.closest("tbody.ftg[data-platte]") : e.target.closest("#tt tr[data-e], [data-ablage], #tt"));
document.addEventListener("dragover", (e) => {
  document.querySelectorAll(".dropp").forEach((x) => x.classList.remove("dropp"));
  const d = dropZiel(e); if (d) { e.preventDefault(); d.classList.add("dropp"); }
});
document.addEventListener("dragend", () => { zug = null; document.querySelectorAll(".dropp").forEach((x) => x.classList.remove("dropp")); });
document.addEventListener("drop", (e) => {
  const d = dropZiel(e); if (!d) return; e.preventDefault();
  const z = d.matches("tr[data-e]") ? d : null;
  if (zug.art === "katalog") hinzufuegen(baugZiel(z), zug.id);
  else if (zug.art === "baum") {
    const q = kante(zug.id), ziel = baugZiel(z);
    if (q && ziel !== q.asm) {
      if (D.teile[q.e.ziel].typ === "baugr" && (ziel === q.e.ziel || gang(q.e.ziel).some((x) => x.e.ziel === ziel))) meldung("Eine Baugruppe kann sich nicht selbst enthalten.");
      else aendern(`${D.teile[q.e.ziel].name} verschieben`, () => { D.kinder[q.asm] = D.kinder[q.asm].filter((x) => x.id !== q.e.id); D.kinder[ziel].push(q.e); sel = []; });
    }
  } else if (zug.art === "pos") verteile(zug.ziel, zug.von, d.dataset.platte || "");
  zug = null;
});

/* Spalten ziehen */
function griffe() {
  document.querySelectorAll(".griff").forEach((g) => g.addEventListener("mousedown", (e) => {
    e.preventDefault(); g.classList.add("zieht"); const r = $("#raum"), start = e.clientX, was = g.dataset.g;
    const bl = parseInt(getComputedStyle(r).getPropertyValue("--bl")) || 260, br = parseInt(getComputedStyle(r).getPropertyValue("--br")) || 330;
    const bewegt = (m) => { const d = m.clientX - start; if (was === "bl") r.style.setProperty("--bl", Math.max(200, Math.min(600, bl + d)) + "px"); else r.style.setProperty("--br", Math.max(240, Math.min(560, br - d)) + "px"); };
    const los = () => { g.classList.remove("zieht"); removeEventListener("mousemove", bewegt); removeEventListener("mouseup", los); };
    addEventListener("mousemove", bewegt); addEventListener("mouseup", los);
  }));
}

gerueest(); alles();
