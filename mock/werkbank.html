<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock: Baugruppen-Werkbank</title>
<style>
/* MOCK, nicht Teil der Anwendung. Zeigt die Werkbank für Baugruppen (Entwurf 11.10.2026): Baum links, Arbeitsfläche mit Reitern,
   Inspektor rechts, Katalog-Schublade, Rückgängig, Befehlspalette. Alles darin ist bedienbar, die Daten stehen im Skript unten.
   Farben und Masse wie app.css; Datei im Browser öffnen.
   Vorbilder: VS Code (Baum, Befehlspalette), PrusaSlicer (Objektliste mit Parametern je Objekt), Onshape/KiCad (Stückliste, Auswahl springt). */
:root {
  --s1: 3px; --s2: 5px; --s3: 8px; --s4: 13px; --s5: 21px; --radius: 4px;
  --bg: oklch(0.965 0.004 60); --panel: oklch(1 0 0); --panel-2: oklch(0.985 0.003 60);
  --line: oklch(0.895 0.006 60); --line-strong: oklch(0.82 0.008 60);
  --ink: oklch(0.245 0.01 45); --ink-2: oklch(0.42 0.01 50); --ink-3: oklch(0.50 0.008 50);
  --accent: oklch(0.565 0.165 30); --accent-ink: oklch(0.99 0.01 30); --accent-soft: oklch(0.945 0.03 30);
  --good: oklch(0.52 0.13 150); --warn: oklch(0.62 0.14 80); --crit: oklch(0.55 0.18 18);
  --sel: oklch(0.94 0.02 40); --shadow: 0 8px 24px oklch(0 0 0 / 0.18);
  --mono: 'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace;
}
:root[data-thema="dunkel"] {
  --bg: oklch(0.165 0.005 60); --panel: oklch(0.205 0.006 60); --panel-2: oklch(0.235 0.006 60);
  --line: oklch(0.295 0.008 60); --line-strong: oklch(0.375 0.01 60);
  --ink: oklch(0.945 0.005 60); --ink-2: oklch(0.80 0.008 60); --ink-3: oklch(0.68 0.01 60);
  --accent: oklch(0.735 0.155 34); --accent-ink: oklch(0.17 0.03 30); --accent-soft: oklch(0.285 0.05 32);
  --good: oklch(0.72 0.14 150); --warn: oklch(0.8 0.15 85); --crit: oklch(0.68 0.19 15);
  --sel: oklch(0.29 0.03 40); --shadow: 0 8px 24px oklch(0 0 0 / 0.5);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 13px/1.35 'Barlow', 'Segoe UI', Helvetica, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }
.dim { color: var(--ink-3); }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Gerüst: Kopfleiste, drei Spalten, Statuszeile ---------- */
.wb { display: grid; height: 100vh; grid-template-rows: 38px 1fr 24px; }
.leiste { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.leiste .titel { font-weight: 600; font-size: 14px; white-space: nowrap; }
.leiste .titel small { font-weight: 400; color: var(--ink-3); margin-left: 6px; }
.trenner { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.luecke { flex: 1; }
.kn { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 3px 8px; cursor: pointer; white-space: nowrap; }
.kn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line); }
.kn:disabled { opacity: 0.4; cursor: default; }
.kn.rand { border-color: var(--line); background: var(--panel-2); }
.kn.akzent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
kbd { font: 11px var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--ink-3); }
.wahl { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 6px; }
.marke { font: 11px var(--mono); padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line-strong); color: var(--ink-2); }
.marke.fork { color: var(--accent); border-color: var(--accent); }

.raum { display: grid; grid-template-columns: var(--bl, 300px) 5px 1fr 5px var(--br, 330px); min-height: 0; }
.spalte { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
.mitte { background: var(--bg); }
.griff { cursor: col-resize; background: var(--line); }
.griff:hover, .griff.zieht { background: var(--accent); }
.kopf { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-bottom: 1px solid var(--line); flex: none; }
.kopf b { font: 600 11px var(--mono); letter-spacing: 0.1em; color: var(--ink-3); }
.stat { display: flex; align-items: center; gap: 16px; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12px; }
.stat b { font-family: var(--mono); font-weight: 500; color: var(--ink); }

/* ---------- Baum ---------- */
.filter { display: flex; gap: 5px; padding: 6px 8px; border-bottom: 1px solid var(--line); flex: none; }
.filter input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 7px; }
.chip { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.chip.an { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.baum { flex: 1; overflow: auto; padding: 4px 0; outline: none; }
.z { display: flex; align-items: center; gap: 5px; height: 24px; padding-right: 8px; cursor: default; white-space: nowrap; border-left: 2px solid transparent; }
.z:hover { background: var(--panel-2); }
.z.sel { background: var(--sel); border-left-color: var(--accent); }
.z.dropp { outline: 1px dashed var(--accent); outline-offset: -1px; background: var(--accent-soft); }
.z .pf { width: 14px; text-align: center; color: var(--ink-3); cursor: pointer; font-size: 10px; flex: none; }
.z .n { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.z .m { font: 12px var(--mono); color: var(--accent); flex: none; }
.z .sub { font: 11px var(--mono); color: var(--ink-3); flex: none; }
.z .punkt { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.ic-proj { color: var(--accent); }
.ic-baugr { color: oklch(0.55 0.1 250); } .ic-druck { color: oklch(0.58 0.12 60); } .ic-kauf { color: var(--ink-3); }
:root[data-thema="dunkel"] .ic-baugr { color: oklch(0.75 0.1 250); } :root[data-thema="dunkel"] .ic-druck { color: oklch(0.8 0.12 75); }

/* ---------- Katalog-Schublade ---------- */
.schublade { border-top: 1px solid var(--line-strong); display: flex; flex-direction: column; height: 200px; flex: none; }
.schublade.zu { height: 30px; }
.schublade .kopf { cursor: pointer; }
.kat { flex: 1; overflow: auto; }
.k { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; cursor: grab; }
.k:hover { background: var(--panel-2); }
.k .hin { margin-left: auto; opacity: 0; }
.k:hover .hin { opacity: 1; }

/* ---------- Reiter und Arbeitsfläche ---------- */
.reiter { display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; height: 30px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
.reiter button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--ink-2); }
.reiter button.an { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.reiter button .zahl { font: 11px var(--mono); color: var(--ink-3); margin-left: 5px; }
.flaeche { flex: 1; overflow: auto; padding: 12px; min-height: 0; }
.tab { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; }
.tab th { text-align: left; font: 600 11px var(--mono); letter-spacing: 0.08em; color: var(--ink-3); padding: 5px 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
.tab td { padding: 4px 8px; border-bottom: 1px solid var(--line); height: 26px; }
.tab tr.zl:hover { background: var(--panel-2); cursor: default; }
.tab tr.sel { background: var(--sel); }
.tab .re { text-align: right; font-family: var(--mono); }
.tab .gr td { background: var(--panel-2); font-weight: 600; font-size: 12px; color: var(--ink-2); }
h3.ab { font: 600 11px var(--mono); letter-spacing: 0.1em; color: var(--ink-3); margin: 14px 0 6px; }
h3.ab:first-child { margin-top: 0; }
.leer { color: var(--ink-3); padding: 21px; text-align: center; }

/* 3D-Reiter */
.dreid { height: 100%; min-height: 260px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); position: relative; }
.dreid .hinweis { position: absolute; bottom: 10px; left: 12px; right: 12px; color: var(--ink-3); font-size: 12px; text-align: center; }

/* Fertigung: eine gruppierte Tabelle, kein Raster aus Karten */
.ft tbody.ftg.dropp td { background: var(--accent-soft); }
.ft tr.pos { cursor: grab; }
.ft tr.pos:hover td { background: var(--panel-2); }
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 10px; border-bottom: 1px solid var(--line); }
.kv span { color: var(--ink-2); }
.kv b { font: 500 12.5px var(--mono); }
.stepper2 { display: inline-flex; align-items: center; gap: 3px; }
.stepper2 button, .ft .pos .kn { width: 20px; height: 20px; padding: 0; justify-content: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; line-height: 1; }
.stepper2 span { min-width: 26px; text-align: center; }
.fort { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 10px; }
.fort i { display: block; height: 100%; background: var(--good); }

/* ---------- Inspektor ---------- */
.insp { flex: 1; overflow: auto; padding: 0 0 13px; }
.insp .titel { padding: 10px; border-bottom: 1px solid var(--line); }
.insp .titel b { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.insp .titel .dim { margin-top: 2px; }
.gruppe { padding: 8px 10px 2px; font: 600 11px var(--mono); letter-spacing: 0.1em; color: var(--ink-3); }
.feld { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; padding: 3px 10px; }
.feld label { color: var(--ink-2); }
.feld input, .feld select, .feld textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 6px; min-width: 0; }
.feld input:focus, .feld select:focus, .feld textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.feld .einh { position: relative; } .feld .einh input { padding-right: 24px; text-align: right; font-family: var(--mono); }
.feld .einh span { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 11px; pointer-events: none; }
.feld .stepper { display: flex; gap: 3px; } .feld .stepper input { text-align: center; font-family: var(--mono); }
.feld .stepper button { width: 26px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.verw { padding: 2px 10px; }
.verw a { display: flex; gap: 6px; align-items: center; padding: 3px 4px; border-radius: var(--radius); cursor: pointer; color: var(--ink); text-decoration: none; }
.verw a:hover { background: var(--panel-2); }
.verw .m { margin-left: auto; font: 12px var(--mono); color: var(--accent); }
.warn { margin: 6px 10px; padding: 6px 8px; border: 1px solid var(--warn); border-radius: var(--radius); color: var(--ink); background: color-mix(in oklch, var(--warn) 12%, transparent); font-size: 12px; }

/* ---------- Menü, Palette, Dialog, Meldung ---------- */
.ctx { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: var(--shadow); padding: 4px; min-width: 230px; }
.ctx button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 5px 8px; cursor: pointer; border-radius: 4px; }
.ctx button:hover:not(:disabled) { background: var(--accent-soft); }
.ctx button:disabled { opacity: 0.4; cursor: default; }
.ctx button kbd { margin-left: auto; }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.schleier { position: fixed; inset: 0; background: oklch(0 0 0 / 0.35); z-index: 60; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
.dlg { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); width: min(560px, 92vw); max-height: 70vh; display: flex; flex-direction: column; }
.dlg h2 { margin: 0; font-size: 14px; padding: 12px 14px 4px; }
.dlg p { margin: 0; padding: 0 14px 8px; color: var(--ink-2); }
.dlg .liste { overflow: auto; border-top: 1px solid var(--line); }
.dlg .liste .p { display: flex; gap: 8px; align-items: center; padding: 6px 14px; cursor: pointer; }
.dlg .liste .p.akt, .dlg .liste .p:hover { background: var(--accent-soft); }
.dlg .liste .p kbd { margin-left: auto; }
.dlg input.suche { margin: 8px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; }
.dlg .fuss { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.banner { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: color-mix(in oklch, var(--accent) 12%, var(--panel)); border-bottom: 1px solid var(--accent); }
.banner b { font-weight: 600; }
.toast { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 14px; border-radius: 6px; z-index: 80; font-size: 12.5px; box-shadow: var(--shadow); }
.legende { color: var(--ink-3); font-size: 12px; padding: 6px 0 0; }
</style>
</head>
<body>
<div class="wb" id="wb"></div>

<script>
"use strict";
/* ============================================================== Daten (Graph: Knoten und Kanten) */
const DATEN = () => ({
  teile: {
    // typ: projekt (Bau-Auftrag) | baugr (wiederverwendbarer Baustein) | druck (Druckteil, ein Modell aus dem Katalog) | kauf (Kaufteil)
    toolhead:  { typ: "projekt", name: "Voron Toolhead Umbau", status: "In Arbeit", notiz: "Umbau auf neuen Extruder, Teile für beide Seiten." },
    halloween: { typ: "projekt", name: "Halloween Deko 2026", status: "Entwurf", notiz: "Party am 31.10. — Geister und Skelett-Arme." },
    extruder:  { typ: "baugr", name: "Extruder-Assy", status: "Entwurf", notiz: "" },
    luefter:   { typ: "baugr", name: "Lüfter-Assy", status: "Fertig", notiz: "" },
    skelettarm: { typ: "baugr", name: "Skelett_Arm", status: "Fertig", notiz: "" },
    gehaeuse:  { typ: "druck", name: "Gehaeuse.3mf", fmt: "3MF", g: 38.2, min: 215, abm: [62, 44, 31] },
    zahnrad:   { typ: "druck", name: "Zahnrad_Antrieb.stl", fmt: "STL", g: 6.4, min: 48, abm: [26, 26, 12] },
    halterl:   { typ: "druck", name: "Halter_Luefter.stl", fmt: "STL", g: 4.1, min: 32, abm: [30, 14, 18] },
    halterl2:  { typ: "druck", name: "Halter_Luefter_v2_verstaerkt.stl", fmt: "STL", g: 5.3, min: 41, abm: [30, 14, 18] },
    kanal:     { typ: "druck", name: "Luefterkanal.stl", fmt: "STL", g: 9.8, min: 76, abm: [48, 22, 20] },
    kette:     { typ: "druck", name: "Kabelkette_Anschluss.stl", fmt: "STL", g: 3.0, min: 24, abm: [20, 18, 12] },
    duese:     { typ: "druck", name: "Duesenhalter.step", fmt: "STEP", g: 7.7, min: 55, abm: [28, 28, 22], entwurf: true },
    oberarm:   { typ: "druck", name: "Oberarm.stl", fmt: "STL", g: 12.4, min: 70, abm: [90, 18, 18] },
    unterarm:  { typ: "druck", name: "Unterarm.stl", fmt: "STL", g: 10.9, min: 62, abm: [80, 16, 16] },
    geist:     { typ: "druck", name: "Geist.stl", fmt: "STL", g: 18.5, min: 130, abm: [60, 60, 90] },
    kuerbis:   { typ: "druck", name: "Kuerbis_Laterne.stl", fmt: "STL", g: 22.0, min: 160, abm: [80, 80, 70] },
    m3x10:     { typ: "kauf", name: "Zylinderkopfschraube M3×10", kat: "Schrauben", norm: "ISO 4762", einheit: "Stück", link: "https://aliexpress.com/item/1005001", artnr: "M3x10-A2", hinweis: "Mit Schraubensicherung (Loctite 243)" },
    m3x12:     { typ: "kauf", name: "Zylinderkopfschraube M3×12", kat: "Schrauben", norm: "ISO 4762", einheit: "Stück", link: "https://aliexpress.com/item/1005002", artnr: "M3x12-A2", hinweis: "" },
    m3x8:      { typ: "kauf", name: "Zylinderkopfschraube M3×8", kat: "Schrauben", norm: "ISO 4762", einheit: "Stück", link: "", artnr: "", hinweis: "" },
    einsatz:   { typ: "kauf", name: "Gewindeeinsatz M3 (Wärmeeinsatz)", kat: "Gewindeeinsätze", norm: "", einheit: "Stück", link: "https://www.amazon.de/dp/B0EXAMPLE", artnr: "B0EXAMPLE", hinweis: "Mit 220 °C Lötkolben setzen" },
    lager623:  { typ: "kauf", name: "Kugellager 623-2RS", kat: "Lager", norm: "", einheit: "Stück", link: "", artnr: "623-2RS", hinweis: "" },
    fan4010:   { typ: "kauf", name: "Lüfter 4010 24 V", kat: "Elektronik", norm: "", einheit: "Stück", link: "https://aliexpress.com/item/1005003", artnr: "", hinweis: "Lüfter-Pfeil zeigt zur Düse" },
    ledstrip:  { typ: "kauf", name: "LED-Strip WS2812B 1 m", kat: "Elektronik", norm: "", einheit: "Stück", link: "https://aliexpress.com/item/1005004", artnr: "", hinweis: "5 V, vor dem Einbau testen" },
  },
  kinder: {   // Projekt oder Baugruppe -> Positionen (Kanten). Menge und Druckparameter hängen an der Kante.
    toolhead: [
      { id: "e1", ziel: "extruder", menge: 1 }, { id: "e2", ziel: "luefter", menge: 2 },
      { id: "e3", ziel: "kette", menge: 1, material: "PETG", infill: 20, waende: 3, schicht: 0.2 },
      { id: "e4", ziel: "duese", menge: 1, material: "PETG", infill: 40, waende: 4, schicht: 0.2 },
      { id: "e5", ziel: "m3x10", menge: 4 },
    ],
    extruder: [
      { id: "e6", ziel: "gehaeuse", menge: 1, material: "PETG", infill: 40, waende: 4, schicht: 0.2 },
      { id: "e7", ziel: "zahnrad", menge: 1, material: "PC", infill: 100, waende: 5, schicht: 0.15, notiz: "Nylon-Alternative prüfen" },
      { id: "e8", ziel: "halterl", menge: 2, material: "PETG", infill: 40, waende: 4, schicht: 0.2 },
      { id: "e9", ziel: "m3x10", menge: 8 }, { id: "e10", ziel: "einsatz", menge: 6 }, { id: "e11", ziel: "lager623", menge: 2 },
    ],
    luefter: [
      { id: "e12", ziel: "kanal", menge: 1, material: "PETG", infill: 20, waende: 3, schicht: 0.2 },
      { id: "e13", ziel: "fan4010", menge: 1 }, { id: "e14", ziel: "m3x8", menge: 2 }, { id: "e15", ziel: "m3x10", menge: 2 },
    ],
    halloween: [   // lose Teile und eine Baugruppe nebeneinander — ohne Struktur-Zwang
      { id: "e20", ziel: "skelettarm", menge: 2 },
      { id: "e21", ziel: "geist", menge: 5, material: "PLA", infill: 10, waende: 2, schicht: 0.28 },
      { id: "e22", ziel: "kuerbis", menge: 1, material: "PLA", infill: 15, waende: 2, schicht: 0.2 },
      { id: "e23", ziel: "ledstrip", menge: 1 },
    ],
    skelettarm: [
      { id: "e25", ziel: "oberarm", menge: 1, material: "PLA", infill: 20, waende: 3, schicht: 0.2 },
      { id: "e26", ziel: "unterarm", menge: 1, material: "PLA", infill: 20, waende: 3, schicht: 0.2 },
      { id: "e27", ziel: "m3x8", menge: 4 },
    ],
  },
  // Eine Platte gehört zu einem Projekt und hält Teile mit Mengen: acht Halter dürfen auf zwei Platten zu je vier liegen.
  platten: [
    { id: "p1", projekt: "toolhead", name: "Platte 1", material: "PETG", posten: [{ ziel: "gehaeuse", menge: 1 }, { ziel: "halterl", menge: 2 }] },
    { id: "p2", projekt: "toolhead", name: "Platte 2", material: "PC", posten: [{ ziel: "zahnrad", menge: 1 }] },
    { id: "p3", projekt: "halloween", name: "Platte 1", material: "PLA", posten: [{ ziel: "geist", menge: 3 }, { ziel: "oberarm", menge: 2 }] },
  ],
  nextE: 100, nextP: 4, nextB: 1,
});
let D = DATEN();
let wurzel = "toolhead";
let ausgeklappt = new Set(["toolhead", "toolhead/e1"]);   // Pfade als "e1/e6"
let sel = [];             // Pfad: Kanten-IDs von der Wurzel; [] = Wurzel
let reiter = "stueckliste";
let filter = { text: "", fehlt: false, entwurf: false };
let schubladeZu = false;

const zahl = (n, d = 0) => Number(n).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });

/* Gang durch den Graphen: jede Position mit ihrem Pfad und dem Faktor aus den Mengen der Ebenen darüber. */
function gang(asm = wurzel, faktor = 1, pfad = [], besucht = []) {
  const aus = [];
  if (besucht.includes(asm)) return aus;
  for (const e of D.kinder[asm] || []) {
    const p = [...pfad, e.id], f = faktor * e.menge;
    aus.push({ e, pfad: p, faktor: f, eltern: asm });
    if (D.teile[e.ziel].typ === "baugr") aus.push(...gang(e.ziel, f, p, [...besucht, asm]));
  }
  return aus;
}
const kante = (id) => { for (const a in D.kinder) { const e = D.kinder[a].find((x) => x.id === id); if (e) return { e, asm: a }; } return null; };
const gewaehlt = () => sel.length ? kante(sel[sel.length - 1]) : null;
const gewaehltZiel = () => { const k = gewaehlt(); return k ? k.e.ziel : wurzel; };
const pfadKey = (p) => p.join("/");
const wo = (ziel) => {   // Wo verbaut: alle Baugruppen im Katalog, die das Teil enthalten, mit Menge
  const r = [];
  for (const a in D.kinder) for (const e of D.kinder[a]) if (e.ziel === ziel) r.push({ asm: a, e });
  return r;
};
const pfadZu = (asm, kantenId) => {   // erster Pfad vom aktuellen Projekt zu dieser Kante
  const z = gang().find((x) => x.e.id === kantenId);
  return z ? z.pfad : null;
};

/* ============================================================== Verlauf (Rückgängig / Wiederholen) */
function stand() { return { D: kopie(D), wurzel, sel: [...sel] }; }
function setze(s) { D = kopie(s.D); wurzel = s.wurzel; sel = [...s.sel]; }
function aendern(beschriftung, fn) {
  hist.zurueck.push({ b: beschriftung, s: stand() }); if (hist.zurueck.length > 200) hist.zurueck.shift(); hist.vor = [];
  fn(); bereinigePlatten(); alles();
}
function zurueck() { const h = hist.zurueck.pop(); if (!h) return; hist.vor.push({ b: h.b, s: stand() }); setze(h.s); alles(); meldung(`Rückgängig: ${h.b}`); }
function vor() { const h = hist.vor.pop(); if (!h) return; hist.zurueck.push({ b: h.b, s: stand() }); setze(h.s); alles(); meldung(`Wiederholt: ${h.b}`); }
let meldeZeit;
function meldung(t) { document.querySelectorAll(".toast").forEach((x) => x.remove()); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); clearTimeout(meldeZeit); meldeZeit = setTimeout(() => d.remove(), 2600); }

/* ============================================================== Aktionen */
function hinzufuegen(zielAsm, teilId, menge = 1) {
  const t = D.teile[teilId];
  if (t.typ === "projekt") return meldung("Ein Projekt steckt in nichts anderem.");
  if (t.typ === "baugr" && (teilId === zielAsm || gang(teilId).some((x) => x.e.ziel === zielAsm))) return meldung("Eine Baugruppe kann sich nicht selbst enthalten.");
  const da = D.kinder[zielAsm].find((e) => e.ziel === teilId);
  aendern(`${t.name} hinzufügen`, () => {
    if (da) da.menge += menge;     // nochmal dazu heisst: eins mehr (wie in partAtlas)
    else { const e = { id: "e" + D.nextE++, ziel: teilId, menge }; if (t.typ === "druck") Object.assign(e, { material: "PETG", infill: 20, waende: 3, schicht: 0.2 }); D.kinder[zielAsm].push(e); const g = gang().find((x) => x.e.ziel === zielAsm && zielAsm !== wurzel); if (g) ausgeklappt.add(pfadKey(g.pfad)); }
  });
}
function entfernen(kid) {
  const k = kante(kid); if (!k) return;
  aendern(`${D.teile[k.e.ziel].name} entfernen`, () => { D.kinder[k.asm] = D.kinder[k.asm].filter((e) => e.id !== kid); sel = []; });
}
function setzeFeld(kid, feld, wert) {
  const k = kante(kid); if (!k) return;
  aendern(`${D.teile[k.e.ziel].name}: ${feld}`, () => { k.e[feld] = wert; if (feld === "menge") k.e.menge = Math.max(1, Math.round(wert)); });
}
function tauschen(kid, neuId) {
  const k = kante(kid), alt = D.teile[k.e.ziel].name, neu = D.teile[neuId].name;
  const eltern = k.asm;
  const tiefer = eltern !== wurzel;
  // Merkt die Baugruppe, dass ein Teil getauscht wurde, fragt sie: überschreiben oder als Variante (Fork) speichern?
  dialog(`
    <h2>Teil getauscht: ${esc(alt)} → ${esc(neu)}</h2>
    <p>Das Teil steckt in „${esc(D.teile[eltern].name)}“. Menge ${k.e.menge}× und die Druckparameter der Position bleiben erhalten.</p>
    <p>Wo soll die Änderung hin?</p>
    <div class="fuss">
      <button class="kn rand" data-d="abbruch">Abbrechen</button>
      <button class="kn rand" data-d="ueber">„${esc(D.teile[eltern].name)}“ überschreiben</button>
      <button class="kn akzent" data-d="fork">Als neue Variante speichern (Fork)</button>
    </div>`, (a) => {
    if (a === "abbruch") return;
    aendern(a === "fork" ? `Fork ${D.teile[eltern].name}` : `${alt} tauschen`, () => {
      let asm = eltern, kk = k.e;
      if (a === "fork") {
        const id = "fork" + D.nextB++, orig = D.teile[eltern];
        D.teile[id] = { ...kopie(orig), name: orig.name + " (v" + (D.nextB) + ")", fork: eltern };
        D.kinder[id] = kopie(D.kinder[eltern]).map((e) => ({ ...e, id: "e" + D.nextE++ }));
        // Die Position in der Ebene darüber zeigt auf die neue Variante.
        for (const a2 in D.kinder) D.kinder[a2].forEach((e) => { if (e.ziel === eltern && gang().some((x) => x.e.id === e.id)) e.ziel = id; });
        const idx = D.kinder[eltern].indexOf(D.kinder[eltern].find((e) => e.id === kid));
        kk = D.kinder[id][idx]; asm = id;
        if (!tiefer) wurzel = id;
      }
      kk.ziel = neuId;
      sel = [];
    });
    meldung(a === "fork" ? "Variante angelegt, die Vorlage bleibt unverändert." : "Teil getauscht.");
  });
}
function forkWurzel() {
  aendern("Fork " + D.teile[wurzel].name, () => {
    const id = "fork" + D.nextB++, orig = D.teile[wurzel];
    D.teile[id] = { ...kopie(orig), name: orig.name + " (v" + D.nextB + ")", fork: wurzel };
    D.kinder[id] = kopie(D.kinder[wurzel]).map((e) => ({ ...e, id: "e" + D.nextE++ }));
    D.platten.filter((pp) => pp.projekt === wurzel).forEach((pp) => D.platten.push({ ...kopie(pp), id: "p" + D.nextP++, projekt: id }));
    wurzel = id; sel = []; ausgeklappt = new Set([id]);
  });
  meldung("Fork angelegt. Experimentieren ist jetzt gefahrlos — die Vorlage bleibt unberührt.");
}
function platteNeu() {
  if (!istProjekt()) return meldung("Druckplatten gehören zu einem Projekt.");
  aendern("Druckplatte anlegen", () => { const n = meinePlatten().length + 1; D.platten.push({ id: "p" + D.nextP++, projekt: wurzel, name: "Platte " + n, material: "PETG", posten: [] }); });
}

/* ============================================================== Dialoge, Menüs, Palette */
function dialog(html, ende) {
  const s = document.createElement("div"); s.className = "schleier"; s.innerHTML = `<div class="dlg">${html}</div>`; document.body.append(s);
  const zu = (w) => { s.remove(); ende && ende(w); };
  s.addEventListener("mousedown", (e) => { if (e.target === s) zu("abbruch"); });
  s.addEventListener("click", (e) => { const b = e.target.closest("[data-d]"); if (b) zu(b.dataset.d); });
  s._zu = zu; return s;
}
function waehler(titel, kandidaten, gewaehltFn, hinweis = "") {
  let q = "", akt = 0;
  const s = dialog(`<h2>${esc(titel)}</h2>${hinweis ? `<p>${esc(hinweis)}</p>` : ""}<input class="suche" placeholder="Suchen …" autofocus><div class="liste"></div>`);
  const liste = $(".liste", s), eingabe = $("input", s);

  const zeichne = () => { const t = treffer(); akt = Math.min(akt, Math.max(0, t.length - 1));
    liste.innerHTML = t.map((id, i) => `<div class="p ${i === akt ? "akt" : ""}" data-id="${id}">${ICON[D.teile[id].typ]}<span>${esc(D.teile[id].name)}</span><span class="dim mono">${esc(D.teile[id].norm || D.teile[id].fmt || (D.teile[id].typ === "baugr" ? "Baugruppe" : ""))}</span></div>`).join("") || '<div class="leer">Nichts gefunden.</div>'; };
  eingabe.addEventListener("input", () => { q = eingabe.value; akt = 0; zeichne(); });
  eingabe.addEventListener("keydown", (e) => { const t = treffer();
    if (e.key === "ArrowDown") { akt = Math.min(t.length - 1, akt + 1); zeichne(); e.preventDefault(); }
    if (e.key === "ArrowUp") { akt = Math.max(0, akt - 1); zeichne(); e.preventDefault(); }
    if (e.key === "Enter" && t[akt]) { s._zu("ok"); gewaehltFn(t[akt]); }
    if (e.key === "Escape") s._zu("abbruch"); });
  liste.addEventListener("click", (e) => { const p = e.target.closest(".p"); if (p) { s._zu("ok"); gewaehltFn(p.dataset.id); } });
  zeichne(); setTimeout(() => eingabe.focus());
}
function menuAn(x, y, eintraege) {
  document.querySelectorAll(".ctx").forEach((m) => m.remove());
  const m = document.createElement("div"); m.className = "ctx";
  m.innerHTML = eintraege.map((e) => e === "-" ? "<hr>" : `<button ${e.aus ? "disabled" : ""} data-i="${eintraege.indexOf(e)}">${e.ic || ""}<span>${esc(e.t)}</span>${e.k ? `<kbd>${e.k}</kbd>` : ""}</button>`).join("");
  document.body.append(m);

  m.addEventListener("click", (e) => { const b2 = e.target.closest("button"); if (b2) { m.remove(); eintraege[b2.dataset.i].f(); } });
}
const schliesseMenue = () => document.querySelectorAll(".ctx").forEach((m) => m.remove());
function baumMenue(x, y, kid) {
  const k = kante(kid), t = D.teile[k.e.ziel];
  menuAn(x, y, [
    { t: "Wo verbaut? (Where-Used)", ic: ICON.link, f: () => woDialog(k.e.ziel) },
    { t: "Teil tauschen …", ic: ICON.undo, aus: t.typ === "baugr", f: () => waehler("Tauschen gegen …", Object.keys(D.teile).filter((id) => D.teile[id].typ === t.typ && id !== k.e.ziel && id !== wurzel), (id) => tauschen(kid, id), "Menge und Druckparameter bleiben erhalten.") },
    { t: "Fork dieser Baugruppe", ic: ICON.fork, aus: t.typ !== "baugr", f: forkWurzel },
    "-",
    { t: "Entfernen", k: "Entf", f: () => entfernen(kid) },
  ]);
}
function woDialog(ziel) {
  const t = D.teile[ziel], ww = wege(ziel);
  const s = dialog(`<h2>Wo verbaut: ${esc(t.name)}</h2><p>In ${ww.length} ${ww.length === 1 ? "Verwendung" : "Verwendungen"} im gesamten Katalog, zusammen ${ww.reduce((a, w) => a + w.gesamt, 0)}×.</p>
    <div class="liste">${ww.map((w) => `<div class="p" data-e="${w.weg[w.weg.length - 1].kante}" data-top="${w.weg[0].id}">${ICON[D.teile[w.weg[0].id].typ]}<span>${w.weg.map((x) => esc(D.teile[x.id].name)).join(" › ")}</span><span class="dim mono">${w.weg.map((x) => x.menge).join(" × ")} = ${w.gesamt}×</span></div>`).join("") || '<div class="leer">In keiner Baugruppe und keinem Projekt.</div>'}</div>
    <div class="fuss"><button class="kn rand" data-d="ok">Schliessen</button></div>`);
  s.addEventListener("click", (e) => { const p = e.target.closest(".p"); if (!p) return; s._zu("ok"); springe(p.dataset.e, p.dataset.top); });
}
function springe(kid, top) {
  if (top && top !== wurzel) { wurzel = top; sel = []; ausgeklappt = new Set([top]); }
  const p = pfadZu(null, kid);
  if (!p) return meldung("Diese Verwendung liegt nicht im geöffneten Projekt.");
  for (let i = 1; i < p.length; i++) ausgeklappt.add(pfadKey(p.slice(0, i))); sel = p; alles();
}
const BEFEHLE = () => [
  { t: "Rückgängig", k: "Strg+Z", f: zurueck }, { t: "Wiederholen", k: "Strg+Umschalt+Z", f: vor },
  { t: "Fork anlegen (Projekt oder Baugruppe)", f: forkWurzel }, { t: "Druckplatte anlegen", f: platteNeu },
  { t: "Teil hinzufügen …", k: "Strg+I", f: () => waehler("Teil hinzufügen", kandidaten(), (id) => hinzufuegen(gewaehltAsm(), id)) },
  { t: "Ansicht: Stückliste", f: () => { reiter = "stueckliste"; alles(); } }, { t: "Ansicht: Fertigung", f: () => { reiter = "fertigung"; alles(); } }, { t: "Ansicht: 3D", f: () => { reiter = "dreid"; alles(); } },
  { t: "Nur was fehlt (Filter)", f: () => { filter.fehlt = !filter.fehlt; alles(); } },
  { t: "Alles aufklappen", f: () => { gang().forEach((x) => D.teile[x.e.ziel].typ === "baugr" && ausgeklappt.add(pfadKey(x.pfad))); alles(); } },
  { t: "Alles zuklappen", f: () => { ausgeklappt = new Set([]); alles(); } },
  { t: "Hell / Dunkel umschalten", f: thema },
];
function palette() {
  const bef = BEFEHLE(); let q = "", akt = 0;
  const s = dialog(`<input class="suche" placeholder="Befehl eingeben …"><div class="liste"></div>`);
  const liste = $(".liste", s), ein = $("input", s);
  const t = () => bef.filter((b) => b.t.toLowerCase().includes(q.toLowerCase()));
  const z = () => { liste.innerHTML = t().map((b, i) => `<div class="p ${i === akt ? "akt" : ""}" data-i="${i}"><span>${esc(b.t)}</span>${b.k ? `<kbd>${b.k}</kbd>` : ""}</div>`).join(""); };
  ein.addEventListener("input", () => { q = ein.value; akt = 0; z(); });
  ein.addEventListener("keydown", (e) => { const l = t();
    if (e.key === "ArrowDown") { akt = Math.min(l.length - 1, akt + 1); z(); e.preventDefault(); }
    if (e.key === "ArrowUp") { akt = Math.max(0, akt - 1); z(); e.preventDefault(); }
    if (e.key === "Enter" && l[akt]) { s._zu("ok"); l[akt].f(); } if (e.key === "Escape") s._zu("abbruch"); });

  z(); setTimeout(() => ein.focus());
}
const kandidaten = () => Object.keys(D.teile).filter((id) => id !== wurzel && D.teile[id].typ !== "projekt");
const gewaehltAsm = () => { const k = gewaehlt(); if (!k) return wurzel; return D.teile[k.e.ziel].typ === "baugr" ? k.e.ziel : k.asm; };
function thema() { const h = document.documentElement; h.dataset.thema = h.dataset.thema === "dunkel" ? "" : "dunkel"; }

/* ============================================================== Rechnen: Summen */
function summen() {
  const druck = {}, kauf = {}; let g = 0, min = 0, teile = 0;
  for (const { e, faktor } of gang()) {
    const t = D.teile[e.ziel];
    if (t.typ === "druck") {
      const d = (druck[e.ziel] ||= { ziel: e.ziel, menge: 0, mats: new Set(), pos: [] });
      d.menge += faktor; d.mats.add(e.material || "–"); d.pos.push(e);
      g += t.g * faktor; min += t.min * faktor; teile += faktor;
    } else if (t.typ === "kauf") { (kauf[e.ziel] ||= { ziel: e.ziel, menge: 0 }).menge += faktor; }
  }
  return { druck: Object.values(druck), kauf: Object.values(kauf), g, min, teile };
}
const istProjekt = () => D.teile[wurzel].typ === "projekt";
const meinePlatten = () => D.platten.filter((p) => p.projekt === wurzel);
function bedarfVon(root) {
  const b = {};
  for (const { e, faktor } of gang(root)) if (D.teile[e.ziel].typ === "druck") b[e.ziel] = (b[e.ziel] || 0) + faktor;
  return b;
}
/* Verteilt heisst: Summe der Mengen auf allen Platten des Projekts ≥ Bedarf aus der Projekt-Stückliste (über Baugruppen hinweg). */
function plan() {
  const bedarf = bedarfVon(wurzel), verteilt = {};
  if (istProjekt()) for (const p of meinePlatten()) for (const x of p.posten) verteilt[x.ziel] = (verteilt[x.ziel] || 0) + x.menge;
  let ges = 0, ver = 0;
  for (const z in bedarf) { ges += bedarf[z]; ver += Math.min(bedarf[z], verteilt[z] || 0); }
  return { bedarf, verteilt, ges, ver };
}
let PLAN = null;
const offen = (z) => Math.max(0, ((PLAN ||= plan()).bedarf[z] || 0) - (PLAN.verteilt[z] || 0));
const verteilung = () => (PLAN = plan());
function bereinigePlatten() {      // Teile, die nicht mehr gebraucht werden, verlassen die Platten
  for (const pl of D.platten) {
    if (!D.kinder[pl.projekt]) continue;
    const bed = bedarfVon(pl.projekt);
    pl.posten.forEach((x) => { x.menge = Math.min(x.menge, bed[x.ziel] || 0); });
    pl.posten = pl.posten.filter((x) => x.menge > 0);
  }
}
function verteile(ziel, von, nach) {
  if (von === nach) return;
  const pl = verteilung(), name = D.teile[ziel].name;
  aendern(`${name} → ${nach ? D.platten.find((p) => p.id === nach).name : "nicht verteilt"}`, () => {
    let menge;
    if (von) { const pv = D.platten.find((p) => p.id === von), i = pv.posten.findIndex((x) => x.ziel === ziel); menge = pv.posten[i].menge; pv.posten.splice(i, 1); }
    else menge = Math.max(0, (pl.bedarf[ziel] || 0) - (pl.verteilt[ziel] || 0));
    if (nach && menge) { const pn = D.platten.find((p) => p.id === nach), ex = pn.posten.find((x) => x.ziel === ziel); if (ex) ex.menge += menge; else pn.posten.push({ ziel, menge }); }
  });
}
function postenMenge(platte, ziel, delta) {
  verteilung();
  const pp = D.platten.find((p) => p.id === platte), x = pp.posten.find((q) => q.ziel === ziel);
  const neu = Math.max(1, Math.min(x.menge + delta, x.menge + offen(ziel)));
  if (neu === x.menge) return meldung(delta > 0 ? "Mehr braucht das Projekt nicht." : "Weniger als 1: mit × zurückgeben.");
  aendern(`${D.teile[ziel].name}: ${neu}× auf ${pp.name}`, () => { x.menge = neu; });
}

/* ============================================================== Zeichnen */
function alles() { PLAN = null; zeichneLeiste(); zeichneBaum(); zeichneMitte(); zeichneInsp(); zeichneStatus(); }
function gerueest() {
  $("#wb").innerHTML = `
    <div class="leiste" id="leiste"></div>
