# Baut das Desktop-Programm (Linux-AppImage) und legt es als Artefakt zum Herunterladen ab. Gebaut wird auf Ubuntu 22.04, weil ein
# AppImage nur auf Systemen läuft, deren C-Bibliothek mindestens so neu ist wie die des Baurechners.
name: Desktop

on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", "partatlas/**", "requirements.txt", ".github/workflows/desktop.yml"]

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Systempakete für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils
      - name: Python-Pakete
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Bauen
        env:
          PYTHON: python
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./desktop/bauen.sh
      - uses: actions/upload-artifact@v4
        with:
          name: partAtlas-Linux-Systemwebansicht
          path: desktop/partatlas-linux-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: partAtlas-AppImage
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
