<!doctype html>
<html lang="de" data-app="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>partAtlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23e87a5c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/app.css">
<script type="importmap">{"imports": {"three": "/web/vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="app">
  <nav class="rail">
    <button class="rail-btn aktiv" data-rail="katalog" title="Katalog">▦</button>
    <button class="rail-btn" data-rail="papierkorb" title="Papierkorb">🗑</button>
    <span class="rail-luecke"></span>
    <button class="rail-btn" id="einstellungen" title="Einstellungen">⚙</button>
    <button class="rail-btn" id="thema" title="Hell/Dunkel">◐</button>
  </nav>

  <header class="kopf">
    <div class="logo">PARTATLAS <span>KATALOG</span></div>
    <div class="import">
      <button class="knopf akzent" id="import-knopf">＋ Importieren ▾</button>
      <div class="menu" id="import-menu" hidden>
        <button id="wurzel-neu">Ordner hinzufügen …</button>
        <button id="hochladen-knopf">Dateien hochladen …</button>
        <button id="archive-knopf">Archive entpacken …</button>
        <button id="neu-einlesen">Alle Ordner neu einlesen</button>
      </div>
    </div>
    <span class="label">SORTIEREN</span>
    <select id="sortierung" class="knopf">
      <option value="name">Name</option>
      <option value="neu">Neueste</option>
      <option value="gewicht">Gewicht</option>
      <option value="groesse">Grösse</option>
    </select>
    <div class="segment" id="ansicht-wahl"><button data-layout="raster" class="an">Raster</button><button data-layout="liste">Liste</button></div>
    <span class="kopf-luecke"></span>
    <span class="scan-status" id="scan-status"></span>
    <span class="mono dim" id="anzahl"></span>
  </header>

  <aside class="seite">
    <input class="suche" id="suche" placeholder="⌕  Suchen … z. B. halter tag:pla -alt" title="Alle Wörter müssen vorkommen, auch als Wortteil. &quot;genaue Wortfolge&quot; · -wort schliesst aus · Filter: tag: ordner: baugruppe: sammlung: material: format: designer: gedruckt:ja favorit:ja" autocomplete="off">
    <section class="sektion" data-sektion="ansichten">
      <h3><button class="sk-kopf" data-sk="ansichten">ANSICHTEN</button></h3>
      <div class="sk-inhalt">
        <button class="eintrag" data-ansicht="alle"><span>Alle Modelle</span><em id="z-alle"></em></button>
        <button class="eintrag" data-ansicht="neu"><span>⊕ Neu hinzugefügt</span><em></em></button>
        <button class="eintrag" data-ansicht="favoriten"><span>♡ Favoriten</span><em id="z-favoriten"></em></button>
        <button class="eintrag ablage" data-ansicht="warteschlange"><span>☰ Warteschlange</span><em id="z-warteschlange"></em></button>
        <ol class="ws-liste" id="ws-liste"></ol>
      </div>
    </section>
    <section class="sektion" data-sektion="ordner">
      <h3><button class="sk-kopf" data-sk="ordner">ORDNER</button><span class="sk-akt"><button id="wurzel-neu-2" title="Ordner hinzufügen">＋</button><button id="neu-einlesen-2" title="Alle Ordner neu einlesen">⟳</button></span></h3>
      <div class="sk-inhalt">
        <div id="ordner"></div>
      </div>
    </section>
    <section class="sektion" data-sektion="baugruppen">
      <h3><button class="sk-kopf" data-sk="baugruppen">BAUGRUPPEN</button><span class="sk-akt"><button id="baugruppe-neu" title="Neue Baugruppe">＋</button></span></h3>
      <div class="sk-inhalt">
        <div id="baugruppen"></div>
      </div>
    </section>
    <section class="sektion" data-sektion="sammlungen">
      <h3><button class="sk-kopf" data-sk="sammlungen">SAMMLUNGEN</button><span class="sk-akt"><button id="sammlung-neu" title="Neue Sammlung">＋</button></span></h3>
      <div class="sk-inhalt">
        <div id="sammlungen"></div>
      </div>
    </section>
    <section class="sektion" data-sektion="aufraeumen">
      <h3><button class="sk-kopf" data-sk="aufraeumen">AUFRÄUMEN</button></h3>
      <div class="sk-inhalt">
        <button class="eintrag" data-ansicht="duplikate"><span>⧉ Duplikate</span><em id="z-duplikate"></em></button>
        <button class="eintrag" data-ansicht="fehlt"><span>⚠ Datei fehlt</span><em id="z-fehlt"></em></button>
        <button class="eintrag" data-ansicht="unlesbar"><span>✕ Unlesbar</span><em id="z-unlesbar"></em></button>
      </div>
    </section>
    <section class="sektion" data-sektion="formate" data-zu="1">
      <h3><button class="sk-kopf" data-sk="formate">FORMATE</button></h3>
      <div class="sk-inhalt">
        <div id="formate"></div>
      </div>
    </section>
    <section class="sektion" data-sektion="tags" data-zu="1">
      <h3><button class="sk-kopf" data-sk="tags">TAGS</button></h3>
      <div class="sk-inhalt">
        <div id="tag-liste"></div>
      </div>
    </section>
  </aside>

  <main class="mitte">
    <div class="tagleiste" id="tagleiste"></div>
    <div class="filterzeile" id="filterzeile" hidden></div>
    <div class="stapel" id="stapel" hidden></div>
    <div class="listenkopf" id="listenkopf" hidden></div>
    <div class="raster" id="raster"><div class="raster-innen" id="raster-innen"></div></div>
    <div class="leer" id="leer" hidden></div>
    <div class="bg-ansicht" id="bg-ansicht" hidden></div>
  </main>

  <aside class="inspektor" id="inspektor">
    <p class="hinweis">Wähle ein Modell aus, um Details, Vorschau und Tags zu sehen.</p>
  </aside>
</div>

<dialog id="dialog"><form method="dialog" id="dialog-inhalt"></form></dialog>
<div class="toast" id="toast" hidden></div>
<input type="file" id="datei-wahl" multiple hidden accept=".3mf,.stl,.obj,.step,.stp,.zip,.tar,.gz,.tgz,.bz2,.xz">
<input type="file" id="bild-wahl" hidden multiple accept="image/png,image/jpeg,image/webp">
<div class="abwurf" id="abwurf" hidden>Dateien hier ablegen zum Hochladen</div>
<script src="/web/app.js"></script>
<script src="/web/baugruppen.js"></script>
</body>
</html>
