<!doctype html>
<html lang="de" data-app="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>partAtlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23e87a5c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/app.css">
<script type="importmap">{"imports": {"three": "/web/vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="app">
  <nav class="rail">
    <button class="rail-btn aktiv" data-rail="katalog" title="Katalog">▦</button>
    <button class="rail-btn" data-rail="bereinigen" title="Bereinigen">🧹<span class="rail-abz" id="abz-bereinigen" hidden></span></button>
    <span class="rail-luecke"></span>
    <button class="rail-btn" id="roadmap" title="Roadmap — was schon da ist und was kommt">⚑</button>
    <button class="rail-btn" id="einstellungen" title="Einstellungen">⚙</button>
    <button class="rail-btn" id="thema" title="Hell/Dunkel">◐</button>
  </nav>

  <header class="kopf">
    <div class="logo">PARTATLAS <span>KATALOG</span> <small id="version" title="Fassung"></small></div>
    <div class="import">
      <button class="knopf akzent" id="import-knopf">＋ Importieren ▾</button>
      <div class="menu" id="import-menu" hidden>
        <button id="wurzel-neu">Ordner hinzufügen …</button>
        <button id="hochladen-knopf">Dateien hochladen …</button>
        <button id="archive-knopf">Archive entpacken …</button>
        <button id="neu-einlesen">Alle Ordner neu einlesen</button>
      </div>
    </div>
    <span class="label nur-katalog">SORTIEREN</span>
    <select id="sortierung" class="knopf nur-katalog">
      <option value="name">Name</option>
      <option value="neu">Neueste</option>
      <option value="gewicht">Gewicht</option>
      <option value="groesse">Grösse</option>
    </select>
    <span class="label nur-katalog">GRUPPIEREN</span>
    <select id="gruppierung" class="knopf nur-katalog">
      <option value="keine">Keine</option>
      <option value="ordner">Ordner</option>
      <option value="format">Format</option>
      <option value="material">Material</option>
      <option value="status">Status</option>
      <option value="angelegt">Angelegt</option>
    </select>
    <div class="segment nur-katalog" id="ansicht-wahl"><button data-layout="raster" class="an">Raster</button><button data-layout="liste">Liste</button><button data-layout="karten">Karten</button></div>
    <span class="kopf-luecke"></span>
    <span class="scan-status" id="scan-status"></span>
  </header>

  <aside class="seite">
    <div class="suche-feld"><input class="suche" id="suche" placeholder="⌕  Suchen … z. B. halter tag:pla -alt" title="Alle Wörter müssen vorkommen, auch als Wortteil. &quot;genaue Wortfolge&quot; · -wort schliesst aus · Filter: tag: ordner: baugruppe: sammlung: material: format: designer: gedruckt:ja favorit:ja" autocomplete="off"><button class="suche-x" id="suche-x" title="Suche leeren (Esc)" hidden>×</button></div>
    <div class="ans-leiste" id="ansichten">
      <button class="ans-btn" data-ansicht="alle" title="Alle Modelle"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><em id="z-alle"></em></button>
      <button class="ans-btn" data-ansicht="neu" title="Neu hinzugefügt"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg><em id="z-neu"></em></button>
      <button class="ans-btn" data-ansicht="favoriten" title="Favoriten"><svg viewBox="0 0 16 16"><path d="M8 13.5S2.5 10 2.5 6.3A3 3 0 0 1 8 4.8a3 3 0 0 1 5.5 1.5C13.5 10 8 13.5 8 13.5z"/></svg><em id="z-favoriten"></em></button>
    </div>
    <div data-ab-phase="2">
      <button class="eintrag ablage" data-ansicht="warteschlange"><span>☰ Warteschlange</span><em id="z-warteschlange"></em></button>
      <ol class="ws-liste" id="ws-liste"></ol>
    </div>
    <div class="panes">
    <section class="sektion" data-sektion="ordner">
      <h3><span class="sk-titel">Bibliothek</span><span class="sk-akt"><button id="wurzel-neu-2" title="Ordner hinzufügen">＋</button><button id="neu-einlesen-2" title="Alle Ordner neu einlesen">⟳</button></span></h3>
      <div class="sk-inhalt">
        <div id="ordner"></div>
      </div>
    </section>
    <section class="sektion" data-sektion="baugruppen">
      <h3><button class="sk-kopf" data-sk="baugruppen">Baugruppen</button><span class="sk-akt"><button id="baugruppe-neu" title="Neue Baugruppe">＋</button></span></h3>
      <div class="sk-inhalt">
        <div id="baugruppen"></div>
      </div>
    </section>
    <section class="sektion" data-sektion="sammlungen">
      <h3><button class="sk-kopf" data-sk="sammlungen">Sammlungen</button><span class="sk-akt"><button id="sammlung-neu" title="Neue Sammlung">＋</button></span></h3>
      <div class="sk-inhalt">
        <div id="sammlungen"></div>
      </div>
    </section>
    <section class="sektion" data-sektion="tags" data-zu="1">
      <h3><button class="sk-kopf" data-sk="tags">Tags</button></h3>
      <div class="sk-inhalt">
        <div id="tag-liste"></div>
      </div>
    </section>
    <section class="sektion" data-sektion="bereinigen">
      <h3><button class="sk-kopf" data-sk="bereinigen">Bereinigen</button></h3>
      <div class="sk-inhalt">
        <button class="eintrag" data-ansicht="papierkorb"><span>🗑 Papierkorb</span><em id="z-papierkorb"></em></button>
        <button class="eintrag" data-ansicht="duplikate"><span>⧉ Duplikate</span><em id="z-duplikate"></em></button>
        <button class="eintrag" data-ansicht="fehlt"><span>⚠ Datei fehlt</span><em id="z-fehlt"></em></button>
        <button class="eintrag" data-ansicht="unlesbar"><span>✕ Unlesbar</span><em id="z-unlesbar"></em></button>
      </div>
    </section>
    </div>
  </aside>

  <main class="mitte">
    <div class="tagleiste" id="tagleiste"></div>
    <nav class="pfad" id="pfad" hidden aria-label="Ordnerpfad"></nav>
    <div class="filterzeile" id="filterzeile" hidden></div>
    <div class="stapel" id="stapel" hidden></div>
    <div class="listenkopf" id="listenkopf" hidden></div>
    <div class="raster" id="raster"><div class="raster-innen" id="raster-innen"></div></div>
    <div class="leer" id="leer" hidden></div>
    <div class="bg-ansicht" id="bg-ansicht" hidden></div>
    <div class="statuszeile"><span id="anzahl"></span></div>
  </main>

  <aside class="inspektor" id="inspektor">
    <p class="hinweis">Wähle ein Modell aus, um Details, Vorschau und Tags zu sehen.</p>
  </aside>
  <div class="griff links" data-griff="seite" title="Breite ändern (Doppelklick: zurücksetzen)"></div>
  <div class="griff rechts" data-griff="inspektor" title="Breite ändern (Doppelklick: zurücksetzen)"></div>
</div>

<dialog id="dialog"><form method="dialog" id="dialog-inhalt"></form></dialog>
<div class="toast" id="toast" hidden></div>
<div class="menu kontext" id="kontext" hidden></div>
<input type="file" id="datei-wahl" multiple hidden accept=".3mf,.stl,.obj,.step,.stp,.zip,.tar,.gz,.tgz,.bz2,.xz">
<input type="file" id="druck-bild-wahl" hidden multiple accept="image/png,image/jpeg,image/webp">
<input type="file" id="bild-wahl" hidden multiple accept="image/png,image/jpeg,image/webp">
<div class="abwurf" id="abwurf" hidden>Dateien hier ablegen zum Hochladen</div>
<script src="/web/app.js"></script>
<script src="/web/baugruppen.js"></script>
<script src="/web/roadmap.js"></script>
</body>
</html>
